version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: roomfinder_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: roomfinder_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: roomfinder_backend
    depends_on:
      - mysql
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: roomfinder_frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mysql_data:
